server:
  port: 8080
  servlet:
    context-path: /message-center

spring:
  application:
    name: csg-e-card-message-center
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.csg.ecard.messagecenter.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.csg.ecard.messagecenter

logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

app:
  message-id:
    prefix: MSG
  idempotent:
    key-prefix: "idem:"
    default-ttl-seconds: 300

xxl:
  job:
    enabled: false
    executor:
      appname: ${spring.application.name}
      address:
      ip:
      port: 9999
      logpath: logs/xxl-job
      logretentiondays: 30
