server:
  port: 8080
  servlet:
    context-path: /xxzx-api

spring:
  application:
    name: e-msg-service
  profiles:
    active: dev1,local2
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.csg.ecard.messagecenter.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.csg.ecard.messagecenter

logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

app:
  redis:
    enabled: ${APP_REDIS_ENABLED:true}
  organization:
    remote:
      cache-ttl: ${APP_ORGANIZATION_REMOTE_CACHE_TTL:10m}
    tree:
      children-cache-ttl: ${APP_ORGANIZATION_CHILDREN_CACHE_TTL:5m}
      search-limit: ${APP_ORGANIZATION_SEARCH_LIMIT:50}
      resolve-limit: ${APP_ORGANIZATION_RESOLVE_LIMIT:200}
  employee:
    remote:
      cache-ttl: ${APP_EMPLOYEE_REMOTE_CACHE_TTL:10m}
      cache-max-size: ${APP_EMPLOYEE_REMOTE_CACHE_MAX_SIZE:10000}
  message-id:
    prefix: MSG
  idempotent:
    key-prefix: "idem:"
    default-ttl-seconds: 300
  message-schedule:
    batch-size: ${MESSAGE_SCHEDULE_BATCH_SIZE:100}
  message-record:
    max-resend-count: ${MESSAGE_RECORD_MAX_RESEND_COUNT:5}

xxl:
  job:
    enabled: false
    executor:
      appname: ${spring.application.name}
      address:
      ip:
      port: 9999
      logpath: logs/xxl-job
      logretentiondays: 30
